{{ define "main" }}

<h1>{{ .Title }}</h1>

<div class="micro-timeline">

{{- with .Content }}
<div class="micro-intro">
  {{ . }}
</div>
{{- end }}

{{ range .Pages.ByDate.Reverse }}

<div class="micro-post" id="{{ .File.TranslationBaseName }}">

<div class="micro-date">
<a href="{{ .RelPermalink }}">{{ .Date.Format "2006-01-02 15:04" }}</a>
</div>

<div class="micro-content">
{{ .Content }}
</div>

</div>

{{ end }}

</div>

{{ end }}
