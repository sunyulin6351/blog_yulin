{{- define "main" }}
<article class="post-single micro-single">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title">{{ .Title | default (.Date.Format "2006年1月2日 15:04") }}</h1>
    <div class="post-meta">
      <span title="{{ .Date }}">{{ .Date.Format "2006年1月2日 15:04" }}</span>
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  <footer class="post-footer">
    {{ partial "share_icons.html" . }}
  </footer>
</article>
{{- end }}
