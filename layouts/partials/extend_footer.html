<script>
(function () {
  const copyButtons = document.querySelectorAll('.share-copy-btn');
  copyButtons.forEach(function (btn) {
    btn.addEventListener('click', async function () {
      const url = btn.dataset.url;
      const label = btn.querySelector('.share-label');
      const original = label.textContent;
      let ok = false;

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
          ok = true;
        }
      } catch (error) {
        ok = false;
      }

      if (!ok) {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          ok = document.execCommand('copy');
        } catch (error) {
          ok = false;
        } finally {
          textarea.remove();
        }
      }

      if (!ok) {
        window.prompt('复制失败，请手动复制链接：', url);
      }

      label.textContent = ok ? '链接已复制' : '复制失败';
      btn.dataset.feedback = ok ? '链接已复制' : '复制失败';
      btn.classList.toggle('is-copied', ok);
      btn.classList.toggle('is-copy-failed', !ok);
      window.setTimeout(function () {
        label.textContent = original;
        btn.classList.remove('is-copied', 'is-copy-failed');
        btn.dataset.feedback = '';
      }, 1800);
    });
  });

  const searchInput = document.querySelector('#searchInput');
  const searchResults = document.querySelector('#searchResults');
  const searchEmpty = document.querySelector('#searchEmpty');

  if (searchInput && searchResults && searchEmpty) {
    const queryLabel = searchEmpty.querySelector('.search-empty-query');
    const syncSearchEmpty = function () {
      const query = searchInput.value.trim();
      const show = query.length > 0 && searchResults.children.length === 0;
      searchEmpty.hidden = !show;
      if (show && queryLabel) {
        queryLabel.textContent = query;
      }
    };

    new MutationObserver(syncSearchEmpty).observe(searchResults, { childList: true });
    ['input', 'keyup', 'search'].forEach(function (eventName) {
      searchInput.addEventListener(eventName, function () {
        window.setTimeout(syncSearchEmpty, 0);
      });
    });
    syncSearchEmpty();
  }

  const wechatModal = document.querySelector('#wechat-qr-modal');
  const wechatOpen = document.querySelector('[data-wechat-open]');
  const wechatClose = document.querySelector('[data-wechat-close]');

  if (wechatModal && wechatOpen && wechatClose) {
    let lastFocused = null;

    const setWechatOpen = function (open) {
      if (open) {
        lastFocused = document.activeElement;
        wechatModal.hidden = false;
        document.body.classList.add('wechat-modal-open');
        wechatOpen.setAttribute('aria-expanded', 'true');
        wechatClose.focus();
      } else {
        wechatModal.hidden = true;
        document.body.classList.remove('wechat-modal-open');
        wechatOpen.setAttribute('aria-expanded', 'false');
        if (lastFocused && typeof lastFocused.focus === 'function') {
          lastFocused.focus();
        } else {
          wechatOpen.focus();
        }
      }
    };

    wechatOpen.addEventListener('click', function () {
      setWechatOpen(true);
    });

    wechatClose.addEventListener('click', function () {
      setWechatOpen(false);
    });

    wechatModal.addEventListener('click', function (event) {
      if (event.target === wechatModal) {
        setWechatOpen(false);
      }
    });

    document.addEventListener('keydown', function (event) {
      if (wechatModal.hidden) {
        return;
      }

      if (event.key === 'Escape') {
        event.preventDefault();
        setWechatOpen(false);
        return;
      }

      if (event.key !== 'Tab') {
        return;
      }

      const focusable = Array.from(wechatModal.querySelectorAll(
        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
      )).filter(function (element) {
        return !element.disabled && element.offsetParent !== null;
      });

      if (!focusable.length) {
        return;
      }

      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
  }

  const giscusContainer = document.querySelector('#giscus-container');

  if (giscusContainer) {
    const loadGiscus = function () {
      if (giscusContainer.dataset.loaded === 'true') {
        return;
      }
      giscusContainer.dataset.loaded = 'true';

      const script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.setAttribute('data-loading', 'lazy');
      script.setAttribute('data-strict', '0');
      script.setAttribute('data-input-position', 'bottom');

      const attributes = {
        repo: 'data-repo',
        repoId: 'data-repo-id',
        category: 'data-category',
        categoryId: 'data-category-id',
        mapping: 'data-mapping',
        reactionsEnabled: 'data-reactions-enabled',
        emitMetadata: 'data-emit-metadata',
        theme: 'data-theme',
        lang: 'data-lang'
      };

      Object.keys(attributes).forEach(function (key) {
        const value = giscusContainer.dataset[key];
        if (value) {
          script.setAttribute(attributes[key], value);
        }
      });

      giscusContainer.appendChild(script);
    };

    if ('IntersectionObserver' in window) {
      const giscusObserver = new IntersectionObserver(function (entries) {
        if (entries.some(function (entry) { return entry.isIntersecting; })) {
          loadGiscus();
          giscusObserver.disconnect();
        }
      }, { rootMargin: '600px 0px' });
      giscusObserver.observe(giscusContainer);
    } else {
      loadGiscus();
    }
  }

  const nativeButtons = document.querySelectorAll('.share-native-btn');
  if (!navigator.share) {
    nativeButtons.forEach(function (btn) {
      const item = btn.closest('li');
      (item || btn).remove();
    });
    return;
  }

  nativeButtons.forEach(function (btn) {
    btn.hidden = false;
    btn.addEventListener('click', async function () {
      try {
        await navigator.share({
          title: btn.dataset.title || document.title,
          url: btn.dataset.url || window.location.href
        });
      } catch (error) {
        if (error && error.name !== 'AbortError') {
          console.warn('系统分享失败', error);
        }
      }
    });
  });
})();
</script>
