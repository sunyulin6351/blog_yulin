baseURL = "https://blog.yulin.ltd/"
locale = "zh-CN"
title = "雨林说"
theme = "PaperMod"

enableRobotsTXT = true
paginate = 10
disableKinds = ["RSS"]

[author]
  name = "雨林"

[outputs]
  home = ["HTML", "JSON"]

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[params]
  env = "production"
  description = "雨林的个人博客：产品思考、人生系统、健身与理财、阅读与旅行。"
  
  defaultTheme = "dark" # auto / light / dark
  disableThemeToggle = true
  customCSS = ["css/extended/medium.css"]
  disableSpecial1stPost = true
  ShowShareButtons = true
  ShareButtons = ["wechat"]
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  enableSearch = true
  comments = true

  [params.giscus]
    repo = "sunyulin6351/blog_yulin"
    repoId = "R_kgDORHv4Wg"
    category = "General"
    categoryId = "DIC_kwDORHv4Ws4C3Ktx"
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

  # Contents
  ShowToc = false
  TocOpen = false

  # Search
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

# Profile Mode
[params.profileMode]
  enabled = true
  title = "雨林的生活实验室"
  subtitle = "我把生活当作一个长期实验项目，用系统思维拆解问题，用小规模试验验证想法，记录每一次迭代的过程。从时间管理到身体训练，从知识输入到表达输出，我希望一点点搭建属于自己的'人生操作系统'。"
  imageUrl = "/images/profile.jpg"  # 可选：添加头像图片链接
  imageTitle = "雨林"  # 可选：图片标题
  imageWidth = 120
  imageHeight = 120

  [[params.profileMode.buttons]]
    name = "想法"
    url = "/micro/"

  [[params.profileMode.buttons]]
    name = "文章"
    url = "/posts/"

# Social Icons
[[params.socialIcons]]
  name = "Github"
  url = "https://github.com/sunyulin6351"

# 顶部菜单
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

# Taxonomies：分类/标签（PaperMod 自动支持）
[taxonomies]
  category = "categories"
  tag = "tags"

# Markdown 渲染增强
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许文章里使用少量 HTML（比如嵌入视频/iframe）
  [markup.highlight]
    noClasses = false

