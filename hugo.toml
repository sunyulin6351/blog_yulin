baseURL = "https://blog.yulin.ltd/"
languageCode = "zh-cn"
title = "雨林说"
theme = "PaperMod"

enableRobotsTXT = true
paginate = 10

[author]
  name = "雨林"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[params]
  env = "production"
  description = "雨林的个人博客：产品思考、人生系统、健身与理财、阅读与旅行。"
  
  defaultTheme = "auto" # auto / light / dark
  customCSS = ["css/extended/medium.css"]
  disableSpecial1stPost = true
  ShowShareButtons = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true

  #Contents
  ShowToc = true
  TocOpen = false

  #Search
   [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

 #HomeHero
 [params.homeInfoParams]
    Title = "雨林的生活实验室"
    Content = "人生系统 | 生活实验"
  
 # 顶部菜单
 [menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 20

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 30

  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

 # Taxonomies：分类/标签（PaperMod 自动支持）
 [taxonomies]
  category = "categories"
  tag = "tags"

 # Markdown 渲染增强
 [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许文章里使用少量 HTML（比如嵌入视频/iframe）

