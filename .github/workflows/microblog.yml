name: Micro Blog

on:
  issues:
    types: [opened]

# 默认只读；具体 job 再按最小权限提权
permissions:
  contents: read

# 同一时间只处理一条微记录，避免并发 push 冲突
concurrency:
  group: micro-blog
  cancel-in-progress: false

jobs:
  micro:
    name: Create micro post
    # 只允许仓库所有者自己开的 issue 触发，避免公开仓库被任意 issue 调用写权限流程
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create micro post
        env:
          # issue 内容只能通过 env 传入，不能直接插进 run 脚本
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Shanghai date +"%Y-%m-%d-%H%M")
          FILE="content/micro/${DATE}-${ISSUE_NUMBER}.md"

          mkdir -p content/micro
          {
            printf -- '---\n'
            printf 'date: %s\n' "$(TZ=Asia/Shanghai date -Iseconds)"
            printf 'type: micro\n'
            printf 'draft: false\n'
            printf -- '---\n\n'
            printf '%s\n' "$ISSUE_TITLE"
          } > "$FILE"

          echo "MICRO_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Commit and push
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$MICRO_FILE"
          git commit -m "micro: ${ISSUE_TITLE}"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Build and deploy
    needs: micro
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.0'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  close:
    name: Close issue
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
