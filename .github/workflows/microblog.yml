name: Micro Blog

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  microblog:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Create micro post
      run: |
        DATE=$(date +"%Y-%m-%d-%H%M")
        CONTENT="${{ github.event.issue.title }}"
        FILE="content/micro/$DATE.md"

        mkdir -p content/micro

        echo "---" > $FILE
        echo "date: $(date -Iseconds)" >> $FILE
        echo "type: micro" >> $FILE
        echo "draft: false" >> $FILE
        echo "---" >> $FILE
        echo "" >> $FILE
        echo "$CONTENT" >> $FILE

    - name: Commit and push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "micro: ${{ github.event.issue.title }}"
        git push

    - name: Close Issue
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed'
          })
